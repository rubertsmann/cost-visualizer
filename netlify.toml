[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "25"

# Single-page app: every path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed asset filenames are immutable, so cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
